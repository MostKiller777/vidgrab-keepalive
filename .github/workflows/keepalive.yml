name: keepalive

# Render free web services spin down after 15 minutes without traffic and show
# their own "welcome to Render" boot screen to whoever knocks next.
#
# This pings every listed service so they stay warm. GitHub's scheduler is not
# precise (a */5 cron often fires 10-20 minutes late), so the desktop app also
# pings its own service every 4 minutes while the PC is on. This workflow is the
# backstop for when the PC is off.
#
# This repository is public, so Actions minutes are unlimited.
# Set the targets once: Settings > Secrets and variables > Actions > Variables
#   Name:  KEEPALIVE_URLS
#   Value: https://vidgrab-kt1q.onrender.com,https://injoy-p9xe.onrender.com

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve targets
        id: targets
        env:
          RAW: ${{ vars.KEEPALIVE_URLS }}
        run: |
          raw="${RAW:-}"
          if [ -z "$raw" ]; then
            echo "::error::Set the repository variable KEEPALIVE_URLS first (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
          echo "list=$raw" >> "$GITHUB_OUTPUT"

      - name: Ping each service
        env:
          LIST: ${{ steps.targets.outputs.list }}
        run: |
          fail=0
          IFS=',' read -ra URLS <<< "$LIST"
          for raw in "${URLS[@]}"; do
            url="$(echo "$raw" | tr -d '[:space:]')"
            url="${url%/}"
            [ -z "$url" ] && continue
            case "$url" in
              http://*|https://*) ;;
              *) echo "::error::Not an http(s) URL: $url"; fail=1; continue ;;
            esac
            echo "â†’ $url"
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 120 \
                     --retry 3 --retry-delay 15 --retry-all-errors \
                     "$url/api/health" || echo "000")
            echo "   status=$code"
            if [ "$code" != "200" ]; then fail=1; fi
          done
          exit "$fail"
