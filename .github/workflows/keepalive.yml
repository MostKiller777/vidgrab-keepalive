name: keepalive

# Render free web services spin down after 15 minutes without traffic.
# A request every 5 minutes keeps the instance warm 24/7 at no cost.
#
# This repository is public, so Actions minutes are unlimited.
# Set the target once: Settings > Secrets and variables > Actions > Variables
#   Name:  VIDGRAB_URL
#   Value: https://your-service.onrender.com

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Resolve target
        id: target
        env:
          RAW: ${{ vars.VIDGRAB_URL }}
        run: |
          url="${RAW%/}"
          if [ -z "$url" ]; then
            echo "::error::Set the repository variable VIDGRAB_URL first (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
          case "$url" in
            http://*|https://*) ;;
            *) echo "::error::VIDGRAB_URL must start with https://"; exit 1 ;;
          esac
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Ping /api/health
        env:
          URL: ${{ steps.target.outputs.url }}
        run: |
          curl -fsS --max-time 90 --retry 3 --retry-delay 10 --retry-all-errors \
            "$URL/api/health" -o /dev/null \
            -w "status=%{http_code} total=%{time_total}s\n"
